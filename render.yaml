# Blueprint Render: Docker + disco SQLite.
# Dashboard → New → Blueprint → este repo.
# Tras el primer deploy, ponga secretos en Environment (no los deje en este archivo).

services:
  - type: web
    name: reloj-cr
    runtime: docker
    # Región de Render más cercana a Colombia (menor latencia). Solo aplica al crear el servicio.
    region: virginia
    plan: starter
    healthCheckPath: /api/health
    dockerContext: .
    dockerfilePath: ./Dockerfile
    disk:
      name: reloj-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: DATA_DIR
        value: /data
      - key: HOSTNAME
        value: 0.0.0.0
      - key: NODE_ENV
        value: production
      # Firmas de sesión y cifrado de plantillas. Render los genera una sola vez;
      # no los regenere: cambiar TEMPLATE_KEY obliga a re-enrolar a todos.
      - key: JWT_SECRET
        generateValue: true
      - key: TEMPLATE_KEY
        generateValue: true
      # Solo integraciones servidor a servidor (la UI usa sesión JWT).
      - key: DEMO_API_KEY
        generateValue: true
      # ADMIN_PASSWORD (12+ caracteres) y SUPERVISOR_PIN (6+ dígitos) son
      # obligatorios: sin ellos el servicio no arranca.
      - key: ADMIN_PASSWORD
        sync: false
      - key: SUPERVISOR_PIN
        sync: false
      - key: NVIDIA_API_KEY
        sync: false
      - key: LLM_PROVIDER
        value: nvidia
      - key: NVIDIA_MODEL
        value: nvidia/nemotron-3-ultra-550b-a55b
      - key: NVIDIA_BASE_URL
        value: https://integrate.api.nvidia.com/v1
