services:
  reloj-cr:
    build: .
    ports:
      - "47321:47321"
    environment:
      # Obligatorios: copie .env.example a .env y complételos.
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Defina ADMIN_PASSWORD en .env}
      SUPERVISOR_PIN: ${SUPERVISOR_PIN:?Defina SUPERVISOR_PIN en .env}
      TEMPLATE_KEY: ${TEMPLATE_KEY:?Defina TEMPLATE_KEY en .env}
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET en .env}
      DEMO_API_KEY: ${DEMO_API_KEY:-}
      ALLOW_INSECURE_DEFAULTS: ${ALLOW_INSECURE_DEFAULTS:-}
      SANDBOX: ${SANDBOX:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      NVIDIA_MODEL: ${NVIDIA_MODEL:-nvidia/nemotron-3-ultra-550b-a55b}
      NVIDIA_BASE_URL: ${NVIDIA_BASE_URL:-https://integrate.api.nvidia.com/v1}
      LLM_ENABLE_THINKING: ${LLM_ENABLE_THINKING:-1}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      DATA_DIR: /data
      PORT: "47321"
      HOSTNAME: 0.0.0.0
    volumes:
      - reloj-data:/data

volumes:
  reloj-data:
