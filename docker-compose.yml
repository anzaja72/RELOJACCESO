services:
  reloj-cr:
    build: .
    ports:
      - "47321:47321"
    environment:
      DEMO_API_KEY: ${DEMO_API_KEY:-demo-rfp-bio-2026}
      NEXT_PUBLIC_DEMO_API_KEY: ${NEXT_PUBLIC_DEMO_API_KEY:-demo-rfp-bio-2026}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-RelojCR-Admin-2026!}
      SUPERVISOR_PIN: ${SUPERVISOR_PIN:-2468}
      TEMPLATE_KEY: ${TEMPLATE_KEY:-}
      JWT_SECRET: ${JWT_SECRET:-}
      SANDBOX: ${SANDBOX:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      NVIDIA_MODEL: ${NVIDIA_MODEL:-nvidia/nemotron-3-ultra-550b-a55b}
      NVIDIA_BASE_URL: ${NVIDIA_BASE_URL:-https://integrate.api.nvidia.com/v1}
      LLM_ENABLE_THINKING: ${LLM_ENABLE_THINKING:-1}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      DATA_DIR: /data
      PORT: "47321"
      HOSTNAME: 0.0.0.0
    volumes:
      - reloj-data:/data

volumes:
  reloj-data:
