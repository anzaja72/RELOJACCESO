<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cronograma de tienda</title>
<style>
  :root {
    --head: #c27ba0; --head-ink: #fff; --name: #e91ea8; --name-bg: #fdf3e1;
    --rest: #6aa84f; --vac: #ffff00; --sick: #ff00ff; --split: #fce5cd; --other: #d9d2e9;
    --total: #e06666; --empty: #fde2e2; --line: #b7b7b7; --ink: #1f1f1f; --muted: #666; --bg: #fff;
    --ok: #2e7d32; --warn: #b26a00; --bad: #c62828;
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--ink); font: 13px/1.35 Calibri, "Segoe UI", Arial, sans-serif; }
  h1 { font-size: 17px; margin: 0 0 2px; }
  .sub { color: var(--muted); margin-bottom: 12px; }
  .estado { display: inline-block; padding: 2px 8px; border-radius: 10px; font-weight: 600; font-size: 12px; margin-left: 6px; }
  .estado.ok { background: #e6f4ea; color: var(--ok); } .estado.bad { background: #fde7e7; color: var(--bad); } .estado.warn { background: #fff4e0; color: var(--warn); }
  .wrap { overflow-x: auto; border: 1px solid var(--line); }
  table { border-collapse: collapse; width: 100%; min-width: 1100px; }
  th, td { border: 1px solid var(--line); padding: 3px 4px; text-align: center; white-space: nowrap; }
  thead th { background: var(--head); color: var(--head-ink); font-weight: 600; }
  th.emp, td.emp { text-align: left; min-width: 170px; position: sticky; left: 0; z-index: 1; }
  thead th.emp { background: var(--head); }
  td.emp { background: var(--name-bg); color: var(--name); font-weight: 600; }
  td.emp small { display: block; color: var(--muted); font-weight: 400; font-size: 11px; }
  th.tot, td.tot { background: var(--total); color: #fff; font-weight: 700; min-width: 58px; }
  td.tot.mal { outline: 3px solid var(--bad); outline-offset: -3px; }
  td.h { min-width: 46px; }
  td.desc { background: var(--rest); font-weight: 700; }
  td.vac { background: var(--vac); font-weight: 700; }
  td.inc { background: var(--sick); font-weight: 700; }
  td.nov { background: var(--other); font-weight: 700; }
  td.part { background: var(--split); }
  td.fuera { background: #eee; color: var(--muted); font-style: italic; }
  td.vacio { background: var(--empty); color: var(--bad); font-weight: 700; }
  td.alerta { box-shadow: inset 0 0 0 2px var(--bad); }
  tr.sep td { height: 14px; background: #fff; border-left: 0; border-right: 0; }
  tfoot td { background: #f3f3f3; font-weight: 600; }
  .leyenda { display: flex; flex-wrap: wrap; gap: 10px; margin: 10px 0; font-size: 12px; color: var(--muted); }
  .leyenda span::before { content: ""; display: inline-block; width: 12px; height: 12px; margin-right: 4px; vertical-align: -2px; border: 1px solid var(--line); background: var(--c); }
  .validacion { margin-top: 14px; display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
  .bloque { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
  .bloque h2 { font-size: 14px; margin: 0 0 6px; }
  .bloque.bad h2 { color: var(--bad); } .bloque.warn h2 { color: var(--warn); } .bloque.ok h2 { color: var(--ok); }
  .bloque ul { margin: 0; padding-left: 18px; } .bloque li { margin: 2px 0; }
  @media print { body { padding: 0; } .wrap { overflow: visible; border: 0; } table { min-width: 0; font-size: 10px; } @page { size: landscape; margin: 8mm; } }
</style>
</head>
<body>
<div id="app">Cargando cronograma…</div>
<script>
/* Pegue aquí, sin cambiarla, la respuesta JSON de la herramienta ver_cronograma (o guardar_turnos) de Reloj CR. */
const DATOS = /*DATOS*/ null /*FIN_DATOS*/;

// ===LOGICA=== (funciones puras: se prueban con node)
const DIAS = ["LUNES", "MARTES", "MIÉRCOLES", "JUEVES", "VIERNES", "SÁBADO", "DOMINGO"];
const MAX_NETO_DIA_MIN = 9 * 60; // Ley 2101: jornada flexible hasta 9 h diarias sin recargo
const TOLERANCIA_MIN = 30;

const aMin = (hm) => { const [h, m] = hm.split(":").map(Number); return h * 60 + m; };
/** Notación de las tiendas: horas en punto sin «:00»; después de medianoche se suma 24 (02:00 → 26). */
const hora = (min) => { const h = Math.floor(min / 60), m = min % 60; return m ? `${h}:${String(m).padStart(2, "0")}` : String(h); };
const horasTxt = (min) => { const h = min / 60; return Number.isInteger(h) ? String(h) : h.toFixed(1).replace(".", ","); };
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (x) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[x]);
const fecha = (iso) => { const [y, m, d] = iso.split("-"); return `${d}-${m}-${y}`; };

/** Interpreta una celda de turnos: "08:00-16:00 · almuerzo 60 min · partido 12:30-14:00 / 15:30-21:00", "descanso", "novedad (x)". */
function leerCelda(txt) {
  if (!txt) return null;
  const t = String(txt).trim();
  if (/^descanso$/i.test(t)) return { tipo: "descanso" };
  const nov = t.match(/^novedad(?:\s*\((.*)\))?$/i);
  if (nov) return { tipo: "novedad", texto: (nov[1] || "NOVEDAD").trim() };
  const m = t.match(/^(\d{1,2}:\d{2})-(\d{1,2}:\d{2})(.*)$/);
  if (!m) return { tipo: "desconocido", texto: t };
  const ini = aMin(m[1]);
  let fin = aMin(m[2]);
  if (fin <= ini) fin += 1440;
  const resto = m[3] || "";
  const alm = resto.match(/almuerzo\s+(\d+)\s*min/i);
  const almuerzo = alm ? Number(alm[1]) : 0;
  const p = resto.match(/partido\s+(\d{1,2}:\d{2})\s*-\s*(\d{1,2}:\d{2})\s*\/\s*(\d{1,2}:\d{2})\s*-\s*(\d{1,2}:\d{2})/i);
  let tramos = [[ini, fin]];
  if (p) {
    const norm = (a, b) => { let x = aMin(a), y = aMin(b); while (x < ini) x += 1440; while (y <= x) y += 1440; return [x, y]; };
    tramos = [norm(p[1], p[2]), norm(p[3], p[4])];
  }
  return { tipo: "turno", ini, fin, almuerzo, neto: fin - ini - almuerzo, tramos, partido: Boolean(p) };
}

/** Novedades del cronograma: "Nombre: vacaciones 2026-11-16→2026-11-20 (registrada)". */
function leerNovedades(lista) {
  return (lista || []).map((s) => {
    const m = String(s).match(/^(.*):\s*(\S+)\s+(\d{4}-\d{2}-\d{2})→(\d{4}-\d{2}-\d{2})\s*\((.*)\)$/);
    return m ? { nombre: m[1].trim(), tipo: m[2], desde: m[3], hasta: m[4], estado: m[5] } : null;
  }).filter((n) => n && !/rechaz|anulad/i.test(n.estado));
}

const claseNovedad = (tipo) => (/vacac/i.test(tipo) ? "vac" : /incap/i.test(tipo) ? "inc" : "nov");

/** Arma la grilla y valida. Devuelve { filas, totalesDia, personasDia, problemas, avisos, ok }. */
function analizar(d) {
  const dias = d.semana.dias;
  const apertura = d.horario_tienda?.apertura ? aMin(d.horario_tienda.apertura) : null;
  let cierre = d.horario_tienda?.cierre ? aMin(d.horario_tienda.cierre) : null;
  if (apertura != null && cierre != null && cierre <= apertura) cierre += 1440;
  const novedades = leerNovedades(d.novedades);
  const problemas = [], avisos = [];
  const totalesDia = dias.map(() => 0), personasDia = dias.map(() => 0);

  const filas = d.empleados.map((e) => {
    const lejos = new Map((e.en_otra_tienda || []).map((s) => { const m = String(s).match(/^(\d{4}-\d{2}-\d{2}) en (.*)$/); return m ? [m[1], m[2]] : null; }).filter(Boolean));
    const invitadoDias = e.prestado_desde ? (String(e.prestado_desde).match(/\d{4}-\d{2}-\d{2}/g) || []) : null;
    let neto = 0, descansos = 0, diasNovedad = 0, turnosN = 0;
    const celdas = dias.map((dia, i) => {
      if (invitadoDias && !invitadoDias.includes(dia)) return { tipo: "fuera", texto: "" };
      if (lejos.has(dia)) return { tipo: "fuera", texto: `En ${lejos.get(dia)}` };
      const c = leerCelda(e.turnos?.[dia]);
      const nov = novedades.find((n) => n.nombre === e.nombre && n.desde <= dia && dia <= n.hasta);
      if (c?.tipo === "turno") {
        turnosN += 1; neto += c.neto; totalesDia[i] += c.neto; personasDia[i] += 1;
        const alertas = [];
        if (nov) alertas.push(`tiene ${nov.tipo} registrada ese día`);
        if (c.neto > MAX_NETO_DIA_MIN) avisos.push(`${e.nombre}: ${horasTxt(c.neto)} h netas el ${DIAS[i].toLowerCase()} (más de 9 h puede generar horas extra).`);
        if (apertura != null && cierre != null && (c.ini < apertura || c.fin > cierre)) avisos.push(`${e.nombre}: el ${DIAS[i].toLowerCase()} trabaja ${hora(c.ini)}–${hora(c.fin)}, fuera del horario de la tienda (${hora(apertura)}–${hora(cierre)}).`);
        if (alertas.length) problemas.push(`${e.nombre}: turno el ${DIAS[i].toLowerCase()} ${fecha(dia)} pero ${alertas.join(", ")}.`);
        return { ...c, alerta: alertas.length > 0 };
      }
      if (c?.tipo === "descanso") { descansos += 1; return c; }
      if (c?.tipo === "novedad") { diasNovedad += 1; return { ...c, clase: claseNovedad(c.texto) }; }
      if (nov) { diasNovedad += 1; return { tipo: "novedad", texto: nov.tipo.toUpperCase(), clase: claseNovedad(nov.tipo) }; }
      if (c?.tipo === "desconocido") { avisos.push(`${e.nombre}: no entendí la celda del ${DIAS[i].toLowerCase()} («${c.texto}»).`); return c; }
      problemas.push(`${e.nombre}: el ${DIAS[i].toLowerCase()} ${fecha(dia)} está sin asignar (turno, descanso o novedad).`);
      return { tipo: "vacio" };
    });

    // Jornada de referencia: número (p. ej. 42) o "mínimo 20". Los días con novedad descuentan 7 h (42 h / 6 días).
    let esperado = null, minimo = null;
    const ref = e.jornada_referencia_h;
    if (typeof ref === "number") esperado = Math.max(0, ref * 60 - Math.min(diasNovedad, 6) * 7 * 60);
    else if (typeof ref === "string" && /m[ií]nimo/i.test(ref)) minimo = Number(ref.replace(/[^\d.]/g, "")) * 60;
    let malTotal = false;
    if (!invitadoDias) {
      if (esperado != null && Math.abs(neto - esperado) > TOLERANCIA_MIN && !(esperado === 0 && neto === 0)) {
        malTotal = true;
        problemas.push(`${e.nombre}: ${horasTxt(neto)} h programadas; su jornada pide ${horasTxt(esperado)} h${diasNovedad ? ` (descontando ${diasNovedad} día(s) de novedad)` : ""}.`);
      }
      if (minimo != null && neto < minimo) { malTotal = true; problemas.push(`${e.nombre}: ${horasTxt(neto)} h, por debajo del mínimo de ${horasTxt(minimo)} h.`); }
      if (turnosN === 7) problemas.push(`${e.nombre}: no tiene día de descanso en la semana.`);
      if (e.ficha_incompleta) problemas.push(`${e.nombre}: ficha incompleta (${[].concat(e.ficha_incompleta).join(", ")}); RR. HH. debe completarla.`);
    }
    return { e, celdas, neto, esperado, malTotal, grupo: invitadoDias ? 3 : e.responsable_de_turno ? 0 : typeof ref === "number" && ref >= 40 ? 1 : 2 };
  });

  for (const f of d.franjas_sin_responsable || []) {
    const m = String(f).match(/^(\d{4}-\d{2}-\d{2}) (.*)$/);
    const i = m ? dias.indexOf(m[1]) : -1;
    problemas.push(`Sin gerente ni coordinador el ${i >= 0 ? `${DIAS[i].toLowerCase()} ${fecha(m[1])}` : f}${m ? ` de ${m[2]}` : ""}.`);
  }
  // Advertencias de Reloj que esta vista no repite ya.
  for (const w of d.advertencias || []) if (!/sin día de descanso|superan la jornada|por debajo del mínimo|ficha incompleta|con novedad o movilidad/i.test(w)) avisos.push(w);

  filas.sort((a, b) => a.grupo - b.grupo);
  return { filas, totalesDia, personasDia, problemas, avisos, ok: problemas.length === 0 };
}
// ===FIN LOGICA===

function celdaHtml(c) {
  if (c.tipo === "turno") {
    const cls = `h${c.partido ? " part" : ""}${c.alerta ? " alerta" : ""}`;
    if (c.partido) return c.tramos.map(([a, b]) => `<td class="${cls}">${hora(a)}-${hora(b)}</td>`).join("");
    return `<td class="${cls}">${hora(c.ini)}</td><td class="${cls}">${hora(c.fin)}</td>`;
  }
  if (c.tipo === "descanso") return `<td colspan="2" class="desc">DESCANSO</td>`;
  if (c.tipo === "novedad") return `<td colspan="2" class="${c.clase}">${esc(c.texto.toUpperCase())}</td>`;
  if (c.tipo === "fuera") return `<td colspan="2" class="fuera">${esc(c.texto)}</td>`;
  if (c.tipo === "vacio") return `<td colspan="2" class="vacio">SIN ASIGNAR</td>`;
  return `<td colspan="2" class="vacio">${esc(c.texto || "?")}</td>`;
}

function render(d) {
  const app = document.getElementById("app");
  if (!d) { app.textContent = "Sin datos: pegue la respuesta de ver_cronograma en DATOS."; return; }
  const a = analizar(d);
  const estado = d.cronograma ? `v${d.cronograma.version} · ${d.cronograma.estado}` : "sin cronograma";
  const listo = a.ok ? `<span class="estado ok">Listo para enviar</span>` : `<span class="estado bad">${a.problemas.length} por corregir</span>`;
  let html = `<h1>${esc(d.tienda)} ${listo}</h1>
    <div class="sub">Semana del ${fecha(d.semana.dias[0])} al ${fecha(d.semana.dias[6])} · Cronograma ${estado} · Horario de la tienda ${d.horario_tienda?.apertura ?? "—"}–${d.horario_tienda?.cierre ?? "—"}</div>
    <div class="wrap"><table><thead><tr><th class="emp" rowspan="2">EMPLEADOS</th>`;
  html += DIAS.map((n) => `<th colspan="2">${n}</th>`).join("") + `<th class="tot">TOTAL</th></tr><tr>`;
  html += d.semana.dias.map((x) => `<th colspan="2">${fecha(x)}</th>`).join("") + `<th class="tot">HORAS</th></tr></thead><tbody>`;
  let grupo = null;
  for (const f of a.filas) {
    if (grupo !== null && f.grupo !== grupo) html += `<tr class="sep"><td colspan="${2 + 14}"></td></tr>`;
    grupo = f.grupo;
    const quien = [f.e.cargo || f.e.tipo_jornada, f.e.codigo].filter(Boolean).join(" · ");
    html += `<tr><td class="emp">${esc(f.e.nombre)}<small>${esc(quien)}${f.grupo === 3 ? " · apoyo" : ""}</small></td>${f.celdas.map(celdaHtml).join("")}`;
    html += `<td class="tot${f.malTotal ? " mal" : ""}" title="${f.esperado != null ? `Jornada: ${horasTxt(f.esperado)} h` : ""}">${horasTxt(f.neto)}</td></tr>`;
  }
  html += `</tbody><tfoot><tr><td class="emp">TOTAL HORAS DÍA</td>${a.totalesDia.map((m) => `<td colspan="2">${horasTxt(m)}</td>`).join("")}<td>${horasTxt(a.totalesDia.reduce((x, y) => x + y, 0))}</td></tr>`;
  html += `<tr><td class="emp">PERSONAS EN TURNO</td>${a.personasDia.map((n) => `<td colspan="2">${n}</td>`).join("")}<td></td></tr></tfoot></table></div>`;
  html += `<div class="leyenda"><span style="--c:var(--rest)">Descanso</span><span style="--c:var(--vac)">Vacaciones</span><span style="--c:var(--sick)">Incapacidad</span><span style="--c:var(--other)">Otra novedad</span><span style="--c:var(--split)">Turno partido</span><span style="--c:var(--empty)">Sin asignar</span><span>Horas: 26 = 2:00 a. m. del día siguiente · total neto sin almuerzo</span></div>`;
  const lista = (xs) => `<ul>${xs.map((x) => `<li>${esc(x)}</li>`).join("")}</ul>`;
  html += `<div class="validacion">`;
  html += a.problemas.length ? `<div class="bloque bad"><h2>Por corregir antes de enviar (${a.problemas.length})</h2>${lista(a.problemas)}</div>` : `<div class="bloque ok"><h2>Sin pendientes</h2><p>Todos los días asignados, horas dentro de la jornada, descansos y cobertura completos.</p></div>`;
  if (a.avisos.length) html += `<div class="bloque warn"><h2>Para revisar (${a.avisos.length})</h2>${lista(a.avisos)}</div>`;
  html += `</div>`;
  app.innerHTML = html;
}

if (typeof document !== "undefined") render(DATOS);
</script>
</body>
</html>
