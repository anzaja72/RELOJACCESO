server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index manual-usuarios.html;
    charset utf-8;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    # El manual no debe aparecer en buscadores.
    add_header X-Robots-Tag "noindex, nofollow" always;

    location = / {
        try_files /manual-usuarios.html =404;
    }
    location /img/ {
        expires 7d;
        try_files $uri =404;
    }

    # Skills: se sirven los paquetes de la carpeta skills/ del repositorio (montada en /srv/skills).
    # El mismo archivo sirve para Claude (.skill) y para ChatGPT (.zip): es un zip con la carpeta y su SKILL.md.
    location ~ ^/descargas/claude/([a-z0-9-]+)\.skill$ {
        alias /srv/skills/$1.skill;
        default_type application/zip;
        add_header Content-Disposition 'attachment; filename="$1.skill"' always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
    location ~ ^/descargas/chatgpt/([a-z0-9-]+)\.zip$ {
        alias /srv/skills/$1.skill;
        default_type application/zip;
        add_header Content-Disposition 'attachment; filename="$1.zip"' always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    location / {
        try_files $uri =404;
    }

    gzip on;
    gzip_types text/html text/css application/javascript;
}
