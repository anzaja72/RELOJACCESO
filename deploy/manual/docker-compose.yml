# Manual de usuarios de Reloj CR detrás de Traefik: https://manual.reloj.leia-softwarelab.tech
# Sirve tal cual la carpeta docs/manual-usuarios (HTML, imágenes y PDF), solo lectura.
# Uso (desde /opt/reloj-cr, después de git pull):
#   docker compose -f deploy/manual/docker-compose.yml up -d
# Para actualizar el manual basta con git pull: nginx lee los archivos montados, no hace falta reconstruir.
# Traefik corre en network_mode host: alcanza al contenedor por su IP en la red propia "reloj-manual-net".
name: reloj-manual

services:
  manual:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ../../docs/manual-usuarios:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [default]
    labels:
      - traefik.enable=true
      - traefik.docker.network=reloj-manual-net
      - traefik.http.routers.reloj-manual.rule=Host(`manual.reloj.leia-softwarelab.tech`)
      - traefik.http.routers.reloj-manual.entrypoints=websecure
      - traefik.http.routers.reloj-manual.tls=true
      - traefik.http.routers.reloj-manual.tls.certresolver=letsencrypt
      - traefik.http.services.reloj-manual.loadbalancer.server.port=80

networks:
  default:
    name: reloj-manual-net
